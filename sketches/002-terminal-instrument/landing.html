<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>> gh-dash — terminal instrument</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<style>
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .landing {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    position: relative;
  }
  /* Very subtle radial cyan behind the input */
  .landing::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 700px;
    height: 700px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(0, 217, 255, 0.06) 0%, transparent 65%);
    pointer-events: none;
    z-index: 0;
  }
  .landing-inner {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 640px;
    animation: fadeUp 600ms ease-out;
  }

  .terminal-icon {
    width: 64px;
    height: 48px;
    border: 1px solid var(--border-bright);
    border-radius: var(--radius);
    margin-bottom: 28px;
    background: var(--bg-elev);
    overflow: hidden;
  }
  .terminal-icon .bar {
    height: 14px;
    background: var(--bg-elev-2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 6px;
    gap: 4px;
  }
  .terminal-icon .dot {
    width: 7px; height: 7px; border-radius: 50%;
  }
  .terminal-icon .dot.r { background: #ff5f56; }
  .terminal-icon .dot.y { background: #ffbd2e; }
  .terminal-icon .dot.g { background: #27c93f; }
  .terminal-icon .body {
    height: 34px;
    background:
      linear-gradient(90deg, transparent 4px, rgba(0,217,255,0.05) 4px, rgba(0,217,255,0.05) 5px, transparent 5px) 0 0/8px 100%,
      var(--bg-elev);
  }

  .wordmark-large {
    font-family: var(--font-mono);
    font-size: 48px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }
  .wordmark-large .prompt { color: var(--cyan); }
  .wordmark-large .name { color: var(--fg); }

  .tagline {
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--fg-muted);
    margin-bottom: 6px;
  }
  .sub {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--fg-subtle);
    margin-bottom: 32px;
  }
  .sub .sep { color: var(--fg-subtle); margin: 0 6px; }

  .input-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
    margin-bottom: 12px;
  }

  .input-wrap {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-wrap .prefix {
    position: absolute;
    left: 16px;
    color: var(--cyan);
    font-family: var(--font-mono);
    font-size: 15px;
    pointer-events: none;
    z-index: 2;
    font-weight: 500;
  }

  .input-wrap input {
    width: 100%;
    background: var(--bg-elev);
    border: 1px solid var(--border-bright);
    color: var(--fg);
    font-family: var(--font-mono);
    font-size: 15px;
    padding: 14px 14px 14px 36px;
    border-radius: var(--radius);
    outline: none;
    transition: border-color 200ms ease, box-shadow 200ms ease, background 200ms ease;
    caret-color: var(--cyan);
  }
  .input-wrap input::placeholder { color: var(--fg-subtle); }
  .input-wrap input:focus {
    border-color: var(--cyan);
    background: var(--bg-elev-2);
    box-shadow: 0 0 0 1px var(--cyan), 0 0 24px -6px var(--cyan);
  }

  .btn-execute {
    background: transparent;
    color: var(--cyan);
    border: 1px solid var(--cyan);
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 0 22px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 200ms ease, box-shadow 200ms ease, color 200ms ease;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .btn-execute:hover {
    background: rgba(0, 217, 255, 0.1);
    box-shadow: 0 0 16px -4px var(--cyan), inset 0 0 16px -8px var(--cyan);
  }
  .btn-execute:active { transform: translateY(1px); }
  .btn-execute .arrow { display: inline-block; transition: transform 200ms ease; }
  .btn-execute:hover .arrow { transform: translateX(3px); }

  .hint {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--fg-subtle);
  }
  .hint .cmd { color: var(--fg-muted); }
  .hint a {
    color: var(--cyan);
    text-decoration: none;
    border-bottom: 1px dotted var(--cyan);
  }
  .hint a:hover { color: var(--green); border-bottom-color: var(--green); text-decoration: none; }

  .ascii-decor {
    position: absolute;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--fg-subtle);
    line-height: 1.4;
    pointer-events: none;
    user-select: none;
    opacity: 0.5;
  }
  .ascii-decor.left { top: 18%; left: 4%; }
  .ascii-decor.right { bottom: 18%; right: 4%; text-align: right; }
  .ascii-decor .g { color: var(--cyan); }

  .examples {
    margin-top: 36px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .example-chip {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--fg-muted);
    border: 1px solid var(--border);
    background: var(--bg-elev);
    padding: 6px 10px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 200ms ease;
  }
  .example-chip::before { content: "→ "; color: var(--fg-subtle); }
  .example-chip:hover {
    border-color: var(--cyan);
    color: var(--cyan);
    box-shadow: 0 0 12px -4px var(--cyan);
  }
</style>
</head>
<body>
<div class="app">

  <header class="header">
    <div class="header-inner">
      <a href="landing.html" class="wordmark">
        <span class="prompt">&gt;</span>
        <span class="name">gh-dash</span>
      </a>
    </div>
  </header>

  <main class="landing">
    <div class="landing-inner">
      <div class="terminal-icon">
        <div class="bar">
          <span class="dot r"></span>
          <span class="dot y"></span>
          <span class="dot g"></span>
        </div>
        <div class="body"></div>
      </div>

      <h1 class="wordmark-large">
        <span class="prompt">&gt;</span><span class="name">gh-dash</span>
      </h1>
      <p class="tagline">// GitHub Personal Dashboard</p>
      <p class="sub">
        view profile<span class="sep">·</span>repos<span class="sep">·</span>contributions<span class="sep">·</span>activity
      </p>

      <form class="input-row" onsubmit="event.preventDefault(); window.location='overview.html';">
        <div class="input-wrap">
          <span class="prefix">$</span>
          <input type="text" id="username" name="username" placeholder="davidsilva131" autocomplete="off" autofocus />
        </div>
        <button class="btn-execute" type="submit">
          EXECUTE <span class="arrow">→</span>
        </button>
      </form>

      <p class="hint">
        <span class="cmd">&gt; try:</span>
        <a href="overview.html">davidsilva131</a>
        <span class="cmd">&nbsp;·&nbsp;or enter any GitHub handle</span>
      </p>

      <div class="examples">
        <div class="example-chip" onclick="document.getElementById('username').value='davidsilva131'">davidsilva131</div>
        <div class="example-chip" onclick="document.getElementById('username').value='gaearon'">gaearon</div>
        <div class="example-chip" onclick="document.getElementById('username').value='tj'">tj</div>
      </div>
    </div>

    <div class="ascii-decor left">
      <span class="g">┌─</span> system: ready<br>
      <span class="g">├─</span> api: github v3<br>
      <span class="g">└─</span> cache: <span class="cyan">warm</span>
    </div>
    <div class="ascii-decor right">
      <span class="g">◆</span> v0.4.2 · preview<br>
      <span class="g">◆</span> build 7c2a9f1<br>
      <span class="g">◆</span> region: us-east-1
    </div>
  </main>

</div>
</body>
</html>
