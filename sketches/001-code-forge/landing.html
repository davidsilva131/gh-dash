<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>gh-dash — GitHub Personal Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .landing-wrap {
      min-height: calc(100vh - 220px);
      display: flex; align-items: center; justify-content: center;
      padding: 48px 24px; position: relative;
    }
    .landing-wrap::before {
      content: ""; position: absolute; top: 50%; left: 50%;
      width: 720px; height: 720px; max-width: 90vw; max-height: 90vw;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at center, rgba(99,102,241,0.12) 0%, rgba(99,102,241,0.04) 35%, transparent 70%);
      pointer-events: none;
    }
    .landing-card {
      position: relative; z-index: 1;
      width: 100%; max-width: 520px;
      background: var(--bg-elev); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 40px 32px; text-align: center;
    }
    .hero { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .hero .octo { width: 36px; height: 36px; }
    .hero h1 { margin: 0; font-size: 32px; font-weight: 600; letter-spacing: -0.02em; }
    .tagline { margin: 0 0 6px; font-size: 14px; color: var(--fg-muted); }
    .sub { margin: 0 0 28px; font-size: 13px; color: var(--fg-subtle); }
    form.search { display: flex; gap: 8px; margin-bottom: 16px; }
    .input-lg {
      flex: 1; height: 42px; padding: 0 14px;
      background: var(--bg); color: var(--fg);
      border: 1px solid var(--border); border-radius: var(--radius);
      font-family: var(--font-mono); font-size: 13px; outline: none;
      transition: border-color 200ms ease, box-shadow 200ms ease;
    }
    .input-lg::placeholder { color: var(--fg-subtle); font-family: var(--font-sans); }
    .input-lg:hover { border-color: var(--border-2); }
    .input-lg:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .btn-lg {
      height: 42px; padding: 0 18px;
      background: var(--accent); color: white;
      border: 1px solid var(--accent); border-radius: var(--radius);
      font-weight: 500; font-size: 13px; cursor: pointer;
      transition: background 200ms ease, border-color 200ms ease;
    }
    .btn-lg:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .hint { font-size: 12px; color: var(--fg-subtle); }
    .hint a {
      color: var(--fg-muted); font-family: var(--font-mono);
      border-bottom: 1px dashed transparent;
      transition: color 200ms ease, border-color 200ms ease;
    }
    .hint a:hover { color: var(--accent-hover); border-color: var(--accent-hover); }
    .landing-bar {
      position: sticky; top: 0; z-index: 10;
      background: rgba(13, 17, 23, 0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      max-width: none; margin: 0; padding: 12px 24px;
    }
    .landing-bar .row { max-width: 1200px; margin: 0 auto; }
  </style>
</head>
<body>
  <header class="landing-bar">
    <div class="row">
      <a href="landing.html" class="wordmark" aria-label="gh-dash home">
        <svg class="octo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="16" cy="16" r="15" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="11.5" cy="13.5" r="1.6" fill="currentColor"/>
          <circle cx="20.5" cy="13.5" r="1.6" fill="currentColor"/>
          <path d="M11 20 Q16 24 21 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
          <path d="M5 16 L9 16 M23 16 L27 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M16 1 L16 5 M16 27 L16 31" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        gh-dash
      </a>
    </div>
  </header>

  <main style="padding: 0;">
    <div class="landing-wrap">
      <section class="landing-card">
        <div class="hero">
          <svg class="octo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="16" cy="16" r="15" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="11.5" cy="13.5" r="1.6" fill="currentColor"/>
            <circle cx="20.5" cy="13.5" r="1.6" fill="currentColor"/>
            <path d="M11 20 Q16 24 21 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
            <path d="M5 16 L9 16 M23 16 L27 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M16 1 L16 5 M16 27 L16 31" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <h1>gh-dash</h1>
        </div>
        <p class="tagline">GitHub Personal Dashboard</p>
        <p class="sub">View any user&apos;s profile, repos, contribution history, and more.</p>
        <form class="search" id="searchForm" autocomplete="off">
          <input class="input-lg" type="text" name="user" id="userInput" placeholder="github username" aria-label="GitHub username"/>
          <button class="btn-lg" type="submit">View Dashboard</button>
        </form>
        <p class="hint">Try: <a href="overview.html">davidsilva131</a></p>
      </section>
    </div>
  </main>

  <footer class="foot">
    Built with <strong>Astro 7</strong> + <strong>React 19</strong> + <strong>Tailwind v4</strong> + <strong>shadcn/ui</strong> + <strong>Recharts</strong>
  </footer>

  <script>
    document.getElementById("searchForm").addEventListener("submit", function(e) {
      e.preventDefault();
      var v = document.getElementById("userInput").value.trim();
      window.location.href = v ? "overview.html?u=" + encodeURIComponent(v) : "overview.html";
    });
  </script>
</body>
</html>
