<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>User not found . gh-dash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .error-stage {
      min-height: calc(100vh - 200px);
      display: flex; align-items: center; justify-content: center;
      padding: 48px 24px;
    }
    .error-card {
      width: 100%; max-width: 420px;
      background: var(--bg-elev); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 36px 32px;
      text-align: center;
    }
    .error-icon {
      width: 56px; height: 56px;
      background: rgba(245, 158, 11, 0.1);
      color: var(--amber);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 18px;
    }
    .error-card h2 { margin: 0 0 6px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
    .error-card p { margin: 0 0 24px; color: var(--fg-muted); font-size: 13px; }
    .error-card .actions { display: flex; gap: 8px; justify-content: center; }
    .error-card .typed {
      font-family: var(--font-mono); color: var(--fg);
      background: var(--bg); border: 1px solid var(--border);
      padding: 4px 10px; border-radius: var(--radius-sm);
      font-size: 13px; display: inline-block; margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <header class="shell">
    <div class="row">
      <a href="overview.html" class="wordmark">
        <svg class="octo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="16" cy="16" r="15" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="11.5" cy="13.5" r="1.6" fill="currentColor"/>
          <circle cx="20.5" cy="13.5" r="1.6" fill="currentColor"/>
          <path d="M11 20 Q16 24 21 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
          <path d="M5 16 L9 16 M23 16 L27 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M16 1 L16 5 M16 27 L16 31" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        gh-dash
      </a>
      <div class="search-inline">
        <span class="icon">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M11 11 L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </span>
        <input type="text" placeholder="Search repos, users, anything..." id="topSearch"/>
      </div>
      <nav class="tabs" role="tablist">
        <a class="tab" href="overview.html" data-tab="overview">Overview</a>
        <a class="tab" href="repos.html" data-tab="repos">Repos</a>
        <a class="tab" href="activity.html" data-tab="activity">Activity</a>
        <a class="tab" href="charts.html" data-tab="charts">Charts</a>
      </nav>
    </div>
  </header>

  <main style="padding: 0;">
    <div class="error-stage">
      <section class="error-card">
        <div class="error-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <path d="M12 3 L22 20 H2 Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" fill="none"/>
            <path d="M12 10 V14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="12" cy="17" r="0.9" fill="currentColor"/>
          </svg>
        </div>
        <h2>User not found</h2>
        <p>We couldn&apos;t find a GitHub user with the username</p>
        <span class="typed">this-user-does-not-exist-404</span>
        <p style="margin-top: 0;">Check the username and try again.</p>
        <div class="actions">
          <a href="landing.html" class="btn">Try again</a>
          <a href="overview.html" class="btn ghost">View example</a>
        </div>
      </section>
    </div>
  </main>

  <footer class="foot">
    Built with <strong>Astro 7</strong> + <strong>React 19</strong> + <strong>Tailwind v4</strong> + <strong>shadcn/ui</strong> + <strong>Recharts</strong>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var input = document.getElementById('topSearch');
      if (input) {
        input.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' && input.value.trim()) {
            window.location.href = 'overview.html?u=' + encodeURIComponent(input.value.trim());
          }
        });
      }
    });
  </script>
</body>
</html>
