<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>davidsilva131 . Activity . gh-dash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .activity-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 2px; }
  </style>
</head>
<body>
  <header class="shell">
    <div class="row">
      <a href="overview.html" class="wordmark">
        <svg class="octo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="16" cy="16" r="15" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="11.5" cy="13.5" r="1.6" fill="currentColor"/>
          <circle cx="20.5" cy="13.5" r="1.6" fill="currentColor"/>
          <path d="M11 20 Q16 24 21 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
          <path d="M5 16 L9 16 M23 16 L27 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M16 1 L16 5 M16 27 L16 31" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        gh-dash
      </a>
      <div class="search-inline">
        <span class="icon">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M11 11 L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </span>
        <input type="text" placeholder="Search repos, users, anything..." id="topSearch"/>
      </div>
      <nav class="tabs" role="tablist">
        <a class="tab" href="overview.html" data-tab="overview">Overview</a>
        <a class="tab" href="repos.html" data-tab="repos">Repos</a>
        <a class="tab" href="activity.html" data-tab="activity" aria-current="page">Activity</a>
        <a class="tab" href="charts.html" data-tab="charts">Charts</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="h-section" style="margin-bottom: 16px;">
      <h2 style="font-size: 16px;">Recent activity</h2>
      <span class="meta">from <span class="mono" style="color: var(--fg-muted);">@davidsilva131</span></span>
    </div>

    <ul class="activity-list" id="activityList"></ul>
  </main>

  <footer class="foot">
    Built with <strong>Astro 7</strong> + <strong>React 19</strong> + <strong>Tailwind v4</strong> + <strong>shadcn/ui</strong> + <strong>Recharts</strong>
  </footer>

  <script>
    var ICONS = {
      push: '<svg width="18" height="18" viewBox="0 0 16 16" fill="none"><circle cx="4" cy="8" r="1.6" stroke="currentColor" stroke-width="1.4"/><circle cx="4" cy="3" r="1.6" stroke="currentColor" stroke-width="1.4"/><circle cx="4" cy="13" r="1.6" stroke="currentColor" stroke-width="1.4"/><path d="M4 4.6 V6.4 M4 9.6 V11.4" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 6 L11 6 a1.5 1.5 0 0 1 1.5 1.5 v0 a1.5 1.5 0 0 1 -1.5 1.5 H6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>',
      pr:   '<svg width="18" height="18" viewBox="0 0 16 16" fill="none"><circle cx="3.5" cy="3.5" r="1.8" stroke="currentColor" stroke-width="1.3"/><circle cx="3.5" cy="12.5" r="1.8" stroke="currentColor" stroke-width="1.3"/><circle cx="12.5" cy="12.5" r="1.8" stroke="currentColor" stroke-width="1.3"/><path d="M3.5 5.3 V10.7 M5.3 3.5 H8 a4 4 0 0 1 4 4 v3.7" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>',
      issue:'<svg width="18" height="18" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="2.4" fill="currentColor"/></svg>',
      star: '<svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M8 1.5 L9.85 5.6 L14.3 6.2 L11 9.3 L11.95 13.7 L8 11.5 L4.05 13.7 L5 9.3 L1.7 6.2 L6.15 5.6 Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" fill="none"/></svg>',
      fork: '<svg width="18" height="18" viewBox="0 0 16 16" fill="none"><circle cx="3" cy="3" r="1.8" stroke="currentColor" stroke-width="1.3"/><circle cx="13" cy="3" r="1.8" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="13" r="1.8" stroke="currentColor" stroke-width="1.3"/><path d="M3 4.8 V6.5 a2 2 0 0 0 2 2 h6 a2 2 0 0 0 2 -2 V4.8 M8 8 V11.2" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>',
      create:'<svg width="18" height="18" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.3"/><path d="M8 4.5 V11.5 M4.5 8 H11.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>'
    };

    var EVENTS = [
      { type: "push",   text: 'Pushed 3 commits to <strong class="mono">main</strong>',          repo: "davidsilva131/gh-dash",        time: "2 hours ago" },
      { type: "pr",     text: 'Opened PR <strong>#42</strong>: Add OAuth flow',                  repo: "davidsilva131/gh-dash",        time: "5 hours ago" },
      { type: "issue",  text: 'Opened issue: Bug in dark-mode toggle persistence',              repo: "davidsilva131/silva-skills",   time: "1 day ago" },
      { type: "star",   text: 'Starred <strong class="mono">withastro/astro</strong>',          repo: "withastro/astro",              time: "1 day ago" },
      { type: "push",   text: 'Pushed 1 commit to <strong class="mono">feature/dark</strong>',  repo: "davidsilva131/instaboost-astro", time: "2 days ago" },
      { type: "create", text: 'Created branch <strong class="mono">feature/oauth-callback</strong>', repo: "davidsilva131/gh-dash",     time: "3 days ago" },
      { type: "fork",   text: 'Forked to <strong class="mono">davidsilva131/recetas-fork</strong>', repo: "recetas-app/recetas",         time: "5 days ago" },
      { type: "pr",     text: 'Merged PR <strong>#38</strong>: Performance pass for charts',      repo: "davidsilva131/gh-dash",        time: "1 week ago" }
    ];

    function renderEvents() {
      var html = EVENTS.map(function(e) {
        return '' +
          '<li class="activity-row">' +
            '<div class="icon-chip">' + ICONS[e.type] + '</div>' +
            '<div class="body">' +
              '<div class="text">' + e.text + '</div>' +
              '<div class="repo">' + e.repo + '</div>' +
            '</div>' +
            '<div class="right">' +
              '<span class="badge">' + e.type.toUpperCase() + '</span>' +
              '<span class="label">' + e.time + '</span>' +
            '</div>' +
          '</li>';
      }).join('');
      document.getElementById('activityList').innerHTML = html;
    }

    document.addEventListener('DOMContentLoaded', function() {
      renderEvents();
      var input = document.getElementById('topSearch');
      if (input) {
        input.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' && input.value.trim()) {
            window.location.href = 'overview.html?u=' + encodeURIComponent(input.value.trim());
          }
        });
      }
    });
  </script>
</body>
</html>
